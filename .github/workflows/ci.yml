name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eval_ci
          POSTGRES_PASSWORD: eval_ci_password
          POSTGRES_DB: eval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval_ci -d eval_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      LOG_TO_FILE: "false"
      POSTGRES_USER: eval_ci
      POSTGRES_PASSWORD: eval_ci_password
      POSTGRES_DB: eval_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Apply and verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check

      - name: Compile Python sources
        run: python -m compileall -q app tests main.py

      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  container:
    name: Container smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare non-secret smoke-test configuration
        run: |
          cp .env.example .env
          mkdir -p .secrets
          printf '%s' 'ci-placeholder-token' > .secrets/cloudflare_tunnel_token

      - name: Validate Compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml config -q

      - name: Build and start the application stack
        run: docker compose up -d --build

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=200
          exit 1

      - name: Show service state
        run: docker compose ps -a

      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes
