services:
  postgres:
    image: postgres:16-alpine
    container_name: eval_platform_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eval_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eval_password}
      POSTGRES_DB: ${POSTGRES_DB:-eval_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eval_user} -d ${POSTGRES_DB:-eval_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
