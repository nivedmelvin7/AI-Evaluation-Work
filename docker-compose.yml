services:
  postgres:
    image: postgres:16-alpine
    container_name: eval_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eval_user
      POSTGRES_PASSWORD: eval_password
      POSTGRES_DB: eval_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval_user -d eval_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
